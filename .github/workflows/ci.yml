# Lint, type check, tests, the migration test and image builds on every PR and push
# (docs/09-conventions.md#cicd). JS checks join when web/ exists.
name: ci

on:
  push:
  pull_request:

# A newer push cancels an older run of the same branch or PR. PR runs are grouped by the PR's
# branch: a PR run that starts after its merge resolves github.ref to main and used to cancel
# main's run, so deploy skipped the merge (2026-11-18). Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy libs
      - run: uv run pytest

  migrations:
    # Applies every migration to an empty pinned Timescale container, runs db/tests (including the
    # compressed-chunk insert test, timescale/timescaledb#7672) and the ingest smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash infra/test-db.sh

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingest
            file: services/ingest/Dockerfile
          - service: api
            file: services/api/Dockerfile
          - service: stream
            file: services/stream/Dockerfile
          - service: collector
            file: collector/Dockerfile
          - service: orchestrator
            file: services/orchestrator/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  k8s:
    # The production manifests on a throwaway single-node k3s, set up by the same scripts as the
    # VM (docs/adr/0005-single-node-k3s.md): schema check, then build, import, migrate, roll out
    # and smoke-test every service through its NodePort.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validate the manifests against the Kubernetes schemas
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize infra | ./kubeconform -strict -summary -
          ./kubeconform -strict -summary infra/k8s/jobs/migrate.yaml
      - name: Install k3s
        run: bash infra/k3s-install.sh
      - name: Deploy the stack
        run: |
          env_file=$(mktemp -p "$PWD" ci-env.XXXX)
          for var in POSTGRES AIRSPACE_OWNER INGEST_WRITER STREAM_WORKER JOBS APP_READER LLM_READONLY GRAFANA_READER DAGSTER_DB MLFLOW_DB BACKUP GRAFANA_ADMIN; do
            echo "${var}_PASSWORD=test" >> "$env_file"
          done
          { echo "R2_ACCOUNT_ID=unset"; echo "R2_ACCESS_KEY_ID="; echo "R2_SECRET_ACCESS_KEY="; } >> "$env_file"
          bash infra/k8s-apply.sh "$(basename "$env_file")"
          # Running it again must change nothing and restart nothing.
          pods() { kubectl -n airspace get pods -l 'app!=migrate' -o name | sort; }
          before=$(pods)
          bash infra/k8s-apply.sh "$(basename "$env_file")"
          [ "$before" = "$(pods)" ]
      - name: Smoke-test the services
        run: |
          curl -sSf --retry 10 --retry-all-errors http://127.0.0.1:30800/healthz
          curl -sSf --retry 10 --retry-all-errors http://127.0.0.1:30801/api/v1/health
          curl -sSf --retry 10 --retry-all-errors -o /dev/null http://127.0.0.1:30300/server_info
          curl -sSf --retry 10 --retry-all-errors http://127.0.0.1:30301/api/health
          bash infra/ingest-admin.sh add-collector --id ci-01 --owner ci | grep -q .
          kubectl -n airspace get hpa public-api
          # NodePorts listen on 127.0.0.1 only.
          ip=$(hostname -I | awk '{print $1}')
          ! curl -s -m 3 "http://$ip:30800/healthz"
      - name: Show the cluster on failure
        if: failure()
        run: |
          kubectl -n airspace get all,pvc,events -o wide || true
          for p in $(kubectl -n airspace get pods -o name); do
            echo "== $p"; kubectl -n airspace logs "$p" --all-containers --tail=50 || true
          done
