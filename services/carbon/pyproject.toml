[project]
name = "airspace-carbon"
version = "0.1.0"
description = "carbon-signal: the simulated grid's carbon intensity (docs/adr/0006-carbon-aware-operations.md)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "airspace-common",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[tool.uv.sources]
airspace-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon"]
