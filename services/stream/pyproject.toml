[project]
name = "airspace-stream"
version = "0.1.0"
description = "P3 stream-worker: squawk and go-around events from live snapshots (docs/04-pipelines.md#p3--stream-worker)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "airspace-common",
  "psycopg[binary]>=3.2",
  "structlog>=24.4",
]

[tool.uv.sources]
airspace-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream"]
