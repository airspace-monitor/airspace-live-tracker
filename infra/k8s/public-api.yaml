# public-api (docs/05-api-contract.md). Stateless, so it scales out: the HPA keeps 1-3 replicas
# on CPU. NodePort on 127.0.0.1 only; `tailscale serve` publishes it as :8001.
apiVersion: v1
kind: Service
metadata:
  name: public-api
  labels:
    app: public-api
spec:
  type: NodePort
  selector:
    app: public-api
  ports:
    - name: http
      port: 8001
      targetPort: http
      nodePort: 30801
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api
  labels:
    app: public-api
spec:
  # No replicas field: the HPA owns it, and a deploy would otherwise scale it back to 1.
  selector:
    matchLabels:
      app: public-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: public-api
    spec:
      containers:
        - name: public-api
          image: airspace-api
          imagePullPolicy: Never  # built and imported on the VM by infra/deploy.sh
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: APP_READER_PASSWORD
              valueFrom:
                secretKeyRef: { name: airspace-env, key: APP_READER_PASSWORD }
            - name: DATABASE_URL
              value: postgres://app_reader:$(APP_READER_PASSWORD)@db:5432/airspace?sslmode=disable
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          # /health checks the database, so it gates traffic but does not restart the pod.
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: public-api
  labels:
    app: public-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: public-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
