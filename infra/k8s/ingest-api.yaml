# P2 ingest-api (docs/04-pipelines.md). One replica: uploads come from one collector every 90 s.
# NodePort on 127.0.0.1 only (k3s nodeport-addresses); `tailscale serve` publishes it as :8000.
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  labels:
    app: ingest-api
spec:
  type: NodePort
  selector:
    app: ingest-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  labels:
    app: ingest-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-api
  template:
    metadata:
      labels:
        app: ingest-api
    spec:
      containers:
        - name: ingest-api
          image: airspace-ingest
          imagePullPolicy: Never  # built and imported on the VM by infra/deploy.sh
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: INGEST_WRITER_PASSWORD
              valueFrom:
                secretKeyRef: { name: airspace-env, key: INGEST_WRITER_PASSWORD }
            - name: DATABASE_URL
              value: postgres://ingest_writer:$(INGEST_WRITER_PASSWORD)@db:5432/airspace?sslmode=disable
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
